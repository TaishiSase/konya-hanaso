<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="こんや話そ">
  <meta name="theme-color" content="#F59E0B">
  <title>こんや話そ</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@300;400;500;700&family=Zen+Maru+Gothic:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
</head>
<body>

  <!-- 認証画面 -->
  <div id="authScreen" class="auth-screen active">
    <div class="auth-bg">
      <div class="auth-blob blob1"></div>
      <div class="auth-blob blob2"></div>
      <div class="auth-blob blob3"></div>
    </div>
    <div class="auth-card">
      <div class="auth-icon">🌙</div>
      <h1 class="auth-title">こんや話そ</h1>
      <p class="auth-sub">ふたりの話し合いノート</p>

      <p class="user-select-label">だれですか？</p>
      <div class="user-select">
        <button class="user-btn" id="userBtnPapa" onclick="selectUser('papa')">
          <span class="user-emoji">👨</span>
          <span class="user-name">パパ</span>
        </button>
        <button class="user-btn" id="userBtnMama" onclick="selectUser('mama')">
          <span class="user-emoji">👩</span>
          <span class="user-name">ママ</span>
        </button>
      </div>

      <div class="password-wrap">
        <input type="password" id="authPassword" class="password-input"
          placeholder="パスワードを入力" autocomplete="current-password">
      </div>
      <button onclick="authenticate()" class="btn-login" id="btnLogin">はじめる</button>
      <p class="auth-error" id="authError"></p>
    </div>
  </div>

  <!-- メインアプリ -->
  <div id="mainApp" class="main-app">

    <!-- ヘッダー -->
    <header class="app-header">
      <h1 class="header-title">
        <span class="header-icon">🌙</span>
        こんや話そ
      </h1>
      <div class="header-right">
        <span class="header-user" id="headerUser"></span>
        <button class="logout-btn" onclick="logout()">ログアウト</button>
      </div>
    </header>

    <!-- 話したいことページ -->
    <div id="topicsPage" class="page">
      <div class="page-inner">
        <div class="page-title-row">
          <h2 class="page-title">話し合いたいこと</h2>
          <span class="topic-count" id="topicCount"></span>
        </div>
        <div id="topicsList" class="topics-list">
          <p class="loading-msg">読み込み中…</p>
        </div>
      </div>
    </div>

    <!-- 履歴ページ -->
    <div id="historyPage" class="page">
      <div class="page-inner">
        <h2 class="page-title">解決した話し合い</h2>
        <div id="historyList" class="topics-list">
          <p class="loading-msg">読み込み中…</p>
        </div>
      </div>
    </div>

    <!-- ボトムナビ -->
    <nav class="bottom-nav">
      <button class="bnav-btn" data-page="topics" onclick="goToPage('topics')">
        <span class="bnav-icon">💬</span>
        <span class="bnav-label">話したいこと</span>
      </button>
      <button class="bnav-btn add-btn" onclick="showAddModal()">
        <span class="add-icon">＋</span>
        <span class="bnav-label">追加</span>
      </button>
      <button class="bnav-btn" data-page="history" onclick="goToPage('history')">
        <span class="bnav-icon">✅</span>
        <span class="bnav-label">解決済み</span>
      </button>
    </nav>

  </div><!-- /mainApp -->

  <!-- 追加モーダル -->
  <div id="addModal" class="modal-overlay">
    <div class="modal-card">
      <div class="modal-header">
        <h3 class="modal-title">話したいことを追加</h3>
        <button class="modal-close" onclick="hideAddModal()">✕</button>
      </div>
      <div class="modal-body">
        <div class="form-group">
          <label class="form-label">内容</label>
          <input type="text" id="topicTitleInput" placeholder="例：保育園の選び方を相談したい"
                 class="form-input" maxlength="100">
        </div>
        <div class="form-group">
          <label class="form-label">カテゴリ</label>
          <div class="cat-chips" id="catChips">
            <button class="cat-chip" data-cat="money"     onclick="selectCategory('money')">💰 お金</button>
            <button class="cat-chip" data-cat="childcare" onclick="selectCategory('childcare')">👶 育児・子ども</button>
            <button class="cat-chip" data-cat="home"      onclick="selectCategory('home')">🏠 家のこと</button>
            <button class="cat-chip" data-cat="couple"    onclick="selectCategory('couple')">💑 二人のこと</button>
            <button class="cat-chip" data-cat="work"      onclick="selectCategory('work')">💼 仕事のこと</button>
          </div>
        </div>
        <div class="form-group">
          <label class="form-label">優先度</label>
          <div class="priority-toggle">
            <button class="priority-btn active" id="priorityNormal" onclick="selectPriority('normal')">普通</button>
            <button class="priority-btn" id="priorityUrgent" onclick="selectPriority('urgent')">🔥 急ぎ</button>
          </div>
        </div>
        <div class="form-group">
          <label class="form-label">いつ話す？</label>
          <div class="timing-toggle" id="addTimingToggle">
            <button class="timing-btn active" data-timing="anytime" onclick="selectTiming('anytime')">いつでもOK</button>
            <button class="timing-btn" data-timing="asap" onclick="selectTiming('asap')">🚨 早めに</button>
            <button class="timing-btn" data-timing="specific_date" onclick="selectTiming('specific_date')">📅 日にち指定</button>
          </div>
          <div id="timingDateWrap" class="timing-date-wrap">
            <input type="date" id="timingDateInput" class="form-input">
          </div>
        </div>
        <p class="form-error" id="addError"></p>
        <button class="btn-submit" id="addSubmitBtn" onclick="submitTopic()">追加する</button>
      </div>
    </div>
  </div>

  <!-- トピック詳細モーダル -->
  <div id="topicModal" class="modal-overlay">
    <div class="modal-card">
      <div class="modal-header">
        <h3 class="modal-title">話し合いの内容</h3>
        <button class="modal-close" onclick="hideTopicModal()">✕</button>
      </div>
      <div class="modal-body">
        <div id="topicModalContent"></div>

        <!-- 話し合いログ -->
        <div class="discussion-logs-section">
          <div class="logs-title">📋 話し合いログ</div>
          <div id="discussionLogsList" class="discussion-logs-list">
            <p class="logs-empty">まだログはありません</p>
          </div>
          <div class="log-add-form">
            <textarea id="newLogInput" class="form-textarea" rows="2" maxlength="300"
                      placeholder="話し合ったことをメモ…"></textarea>
            <button class="btn-add-log" id="addLogBtn" onclick="addDiscussionLog()">📝 ログを追加</button>
          </div>
        </div>

        <div class="topic-actions">
          <button class="btn-edit-action" onclick="showEditModal()">✏️ 議題を編集</button>
          <button class="btn-resolve-action" onclick="showResolveModal()">✅ 解決済みにする</button>
          <button class="btn-delete-action" onclick="deleteTopicFromModal()">🗑 削除する</button>
        </div>
      </div>
    </div>
  </div>

  <!-- 編集モーダル -->
  <div id="editModal" class="modal-overlay">
    <div class="modal-card">
      <div class="modal-header">
        <h3 class="modal-title">議題を編集</h3>
        <button class="modal-close" onclick="cancelEditModal()">✕</button>
      </div>
      <div class="modal-body">
        <div class="form-group">
          <label class="form-label">内容</label>
          <input type="text" id="editTitleInput" class="form-input" maxlength="100">
        </div>
        <div class="form-group">
          <label class="form-label">カテゴリ</label>
          <div class="cat-chips" id="editCatChips">
            <button class="cat-chip" data-cat="money"     onclick="selectEditCategory('money')">💰 お金</button>
            <button class="cat-chip" data-cat="childcare" onclick="selectEditCategory('childcare')">👶 育児・子ども</button>
            <button class="cat-chip" data-cat="home"      onclick="selectEditCategory('home')">🏠 家のこと</button>
            <button class="cat-chip" data-cat="couple"    onclick="selectEditCategory('couple')">💑 二人のこと</button>
            <button class="cat-chip" data-cat="work"      onclick="selectEditCategory('work')">💼 仕事のこと</button>
          </div>
        </div>
        <div class="form-group">
          <label class="form-label">優先度</label>
          <div class="priority-toggle">
            <button class="priority-btn" id="editPriorityNormal" onclick="selectEditPriority('normal')">普通</button>
            <button class="priority-btn" id="editPriorityUrgent" onclick="selectEditPriority('urgent')">🔥 急ぎ</button>
          </div>
        </div>
        <div class="form-group">
          <label class="form-label">いつ話す？</label>
          <div class="timing-toggle" id="editTimingToggle">
            <button class="timing-btn" data-timing="anytime" onclick="selectEditTiming('anytime')">いつでもOK</button>
            <button class="timing-btn" data-timing="asap" onclick="selectEditTiming('asap')">🚨 早めに</button>
            <button class="timing-btn" data-timing="specific_date" onclick="selectEditTiming('specific_date')">📅 日にち指定</button>
          </div>
          <div id="editTimingDateWrap" class="timing-date-wrap">
            <input type="date" id="editTimingDateInput" class="form-input">
          </div>
        </div>
        <p class="form-error" id="editError"></p>
        <button class="btn-submit" id="editSubmitBtn" onclick="submitEditTopic()">保存する</button>
      </div>
    </div>
  </div>

  <!-- 解決モーダル -->
  <div id="resolveModal" class="modal-overlay">
    <div class="modal-card">
      <div class="modal-header">
        <h3 class="modal-title">話し合い完了！🎉</h3>
        <button class="modal-close" onclick="hideResolveModal()">✕</button>
      </div>
      <div class="modal-body">
        <div class="resolve-topic-summary">
          <p class="resolve-topic-title" id="resolveTopicTitle"></p>
        </div>
        <div class="form-group">
          <label class="form-label">決めたこと（任意）</label>
          <textarea id="resolutionMemoInput" placeholder="例：月1回外食することにした"
                    class="form-textarea" rows="3" maxlength="200"></textarea>
        </div>
        <p class="form-error" id="resolveError"></p>
        <button class="btn-submit btn-resolve" id="resolveSubmitBtn" onclick="resolveTopic()">✅ 解決済みにする</button>
      </div>
    </div>
  </div>

  <!-- セレブレーション -->
  <div id="celebration" class="celebration">
    <div class="celebration-inner">
      <div class="celebration-emoji">🎉</div>
      <p class="celebration-text">話し合い完了！</p>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
